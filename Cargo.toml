[package]
name = "rustly"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9",features = ["macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
dotenvy = "0.15.7"
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "migrate"] }
